name: Publish

# We have replace vite-plus with pnpm here, because changesets expects to find
# pnpm installed globally while vite-plus installs it locally for each package.
#
# @see https://github.com/changesets/changesets/issues/2151
# @see https://github.com/voidzero-dev/vite-plus/issues/1169

on:
  push:
    branches:
      - master
  workflow_dispatch:

# recommended: reset permissions and explicitly specify for each job
permissions: {}

# recommended: avoid concurrent runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@3b7c71c440e75fca5d335f779290425fc1117fe8 # v2.1.0

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      version-dir-artifact-id: ${{ steps.version.outputs.version-dir-artifact-id }}
    permissions:
      contents: write # to check out repo (actions/checkout) and commit version changes (changesets/action/version)
      pull-requests: write # to create pull request (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: false # recommended: avoid cache poisoning

      - name: Version packages
        id: version
        uses: changesets/action/version@3b7c71c440e75fca5d335f779290425fc1117fe8 # v2.1.0

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: false # recommended: avoid cache poisoning

      - name: Build packages
        run: |
          pnpm --filter tsv-core build
          pnpm --filter tsv-advanced build
          pnpm --filter tsv-input build
          pnpm --filter tsv-hookform build
          pnpm --filter react-ui build
          pnpm --filter forms build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@3b7c71c440e75fca5d335f779290425fc1117fe8 # v2.1.0
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # to check out repo (actions/checkout) and to create releases (changesets/action/publish)
      id-token: write # for trusted publishing (changesets/action/publish)
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: false # recommended: avoid cache poisoning

      - name: Publish packages
        uses: changesets/action/publish@3b7c71c440e75fca5d335f779290425fc1117fe8 # v2.1.0
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          push-git-tags: true
