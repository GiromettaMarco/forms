packages:
  - apps/*
  - internal/*
  - packages/*

allowBuilds:
  esbuild: false
  msw: false
minimumReleaseAgeExclude:
  - '@gmcode/forms'
  - '@gmcode/inertia-hook-form'
  - '@gmcode/react-ui'
  - '@gmcode/tsv-advanced'
  - '@gmcode/tsv-core'
  - '@gmcode/tsv-hookform'
  - '@gmcode/tsv-input'

catalogMode: prefer
catalog:
  '@babel/core': ^8.0.9
  '@changesets/cli': 3.0.3
  '@inertiajs/core': ^3.9.1
  '@inertiajs/react': ^3.9.1
  '@rolldown/plugin-babel': ^0.2.4
  '@tailwindcss/vite': ^4.3.3
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.8
  '@types/babel__core': ^7.20.5
  '@types/node': ^24.12.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-istanbul': 5.0.5
  axios: ^1.20.0
  babel-plugin-react-compiler: ^1.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  date-fns: ^4.4.0
  es-toolkit: ^1.53.0
  eslint-plugin-perfectionist: ^5.11.1
  i18next: ^26.3.4
  jsdom: ^29.1.1
  laravel-precognition: ^2.1.1
  lucide-react: ^1.16.0
  msw: ^2.15.0
  package-json-from-dist: ^1.0.1
  playwright: ^1.61.1
  radix-ui: ^1.6.7
  react: ^19.3.1
  react-day-picker: ^10.0.2
  react-dom: ^19.3.1
  react-hook-form: ^7.71.2
  react-i18next: ^17.0.8
  react-textarea-autosize: ^8.5.9
  sonner: ^2.0.8
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  vitest-browser-react: ^2.3.0
overrides:
  '@vitest/coverage-istanbul': 'catalog:'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
